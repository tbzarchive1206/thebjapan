name: Update THE B JAPAN archive

on:
  workflow_dispatch:
  schedule:
    - cron: "41 3,15 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: the-b-japan-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Read public Google Drive folders
        env:
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
        run: python scripts/update_the_b_japan.py

      - name: Commit changed archive data
        shell: bash
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No Drive changes found."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update THE B JAPAN archive data"
            git push
          fi

      - name: Prepare minimal Pages artifact
        run: python scripts/prepare_site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
